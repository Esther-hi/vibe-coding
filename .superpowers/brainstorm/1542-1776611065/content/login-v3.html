<h2>登录/注册页 — 最终设计</h2>
<p class="subtitle">注册必填手机号+用户名+密码，登录支持双模式</p>

<div class="section">
<div class="split">
  <div class="mockup">
    <div class="mockup-header">注册页（唯一表单，全部必填）</div>
    <div class="mockup-body" style="padding:16px">
      <div style="text-align:center;margin-bottom:20px">
        <div style="font-size:32px;margin-bottom:8px">🍳</div>
        <div style="font-weight:bold;font-size:18px">智能厨房助手</div>
      </div>
      <div style="display:flex;margin-bottom:16px;background:#f5f5f5;border-radius:24px;padding:4px">
        <div style="flex:1;text-align:center;padding:8px;font-size:13px;color:#999">登录</div>
        <div style="flex:1;text-align:center;padding:8px;background:#d46a3a;color:#fff;border-radius:20px;font-size:13px">注册</div>
      </div>
      <div style="margin-bottom:12px">
        <input style="width:100%;padding:12px;border:1px solid #eee;border-radius:12px;font-size:14px;box-sizing:border-box" placeholder="用户名">
      </div>
      <div style="margin-bottom:12px">
        <div style="display:flex;border:1px solid #eee;border-radius:12px;overflow:hidden">
          <div style="padding:12px;background:#f5f5f5;border-right:1px solid #eee;font-size:13px">+86</div>
          <input style="flex:1;padding:12px;border:none;font-size:14px" placeholder="手机号">
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <input style="flex:1;padding:12px;border:1px solid #eee;border-radius:12px;font-size:14px" placeholder="验证码">
        <button style="padding:12px 16px;background:#fff;color:#d46a3a;border:1px solid #d46a3a;border-radius:12px;font-size:12px;white-space:nowrap">获取验证码</button>
      </div>
      <div style="margin-bottom:12px">
        <input style="width:100%;padding:12px;border:1px solid #eee;border-radius:12px;font-size:14px;box-sizing:border-box" placeholder="密码" type="password">
      </div>
      <div style="margin-bottom:16px">
        <input style="width:100%;padding:12px;border:1px solid #eee;border-radius:12px;font-size:14px;box-sizing:border-box" placeholder="确认密码" type="password">
      </div>
      <button style="width:100%;padding:14px;background:#d46a3a;color:#fff;border:none;border-radius:24px;font-weight:bold;font-size:15px">注册</button>
      <div style="text-align:center;margin-top:8px;font-size:11px;color:#999">注册即表示同意《用户协议》和《隐私政策》</div>
    </div>
  </div>
  <div class="mockup">
    <div class="mockup-header">登录页（双模式切换）</div>
    <div class="mockup-body" style="padding:16px">
      <div style="text-align:center;margin-bottom:20px">
        <div style="font-size:32px;margin-bottom:8px">🍳</div>
        <div style="font-weight:bold;font-size:18px">智能厨房助手</div>
      </div>
      <div style="display:flex;margin-bottom:16px;background:#f5f5f5;border-radius:24px;padding:4px">
        <div style="flex:1;text-align:center;padding:8px;background:#d46a3a;color:#fff;border-radius:20px;font-size:13px">登录</div>
        <div style="flex:1;text-align:center;padding:8px;font-size:13px;color:#999">注册</div>
      </div>
      <div style="display:flex;margin-bottom:16px;gap:0">
        <div style="padding:8px 12px;border-bottom:2px solid #d46a3a;font-size:13px;color:#d46a3a;cursor:pointer">验证码登录</div>
        <div style="padding:8px 12px;border-bottom:2px solid transparent;font-size:13px;color:#999;cursor:pointer">密码登录</div>
      </div>
      <div style="margin-bottom:12px">
        <div style="display:flex;border:1px solid #eee;border-radius:12px;overflow:hidden">
          <div style="padding:12px;background:#f5f5f5;border-right:1px solid #eee;font-size:13px">+86</div>
          <input style="flex:1;padding:12px;border:none;font-size:14px" placeholder="请输入手机号">
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <input style="flex:1;padding:12px;border:1px solid #eee;border-radius:12px;font-size:14px" placeholder="验证码">
        <button style="padding:12px 16px;background:#fff;color:#d46a3a;border:1px solid #d46a3a;border-radius:12px;font-size:12px;white-space:nowrap">获取验证码</button>
      </div>
      <button style="width:100%;padding:14px;background:#d46a3a;color:#fff;border:none;border-radius:24px;font-weight:bold;font-size:15px">登录</button>
      <div style="text-align:center;margin-top:12px;font-size:12px;color:#999;cursor:pointer">忘记密码？</div>
    </div>
  </div>
</div>
</div>

<div class="section">
<h3>忘记密码流程</h3>
<div class="mockup">
  <div class="mockup-header">忘记密码 — 通过手机号验证码重置</div>
  <div class="mockup-body" style="padding:16px">
    <div style="display:flex;align-items:center;margin-bottom:20px">
      <span style="margin-right:8px">←</span>
      <span style="font-weight:bold">忘记密码</span>
    </div>
    <div style="margin-bottom:12px">
      <div style="display:flex;border:1px solid #eee;border-radius:12px;overflow:hidden">
        <div style="padding:12px;background:#f5f5f5;border-right:1px solid #eee;font-size:13px">+86</div>
        <input style="flex:1;padding:12px;border:none;font-size:14px" placeholder="注册时填写的手机号">
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input style="flex:1;padding:12px;border:1px solid #eee;border-radius:12px;font-size:14px" placeholder="验证码">
      <button style="padding:12px 16px;background:#fff;color:#d46a3a;border:1px solid #d46a3a;border-radius:12px;font-size:12px;white-space:nowrap">获取验证码</button>
    </div>
    <div style="margin-bottom:12px">
      <input style="width:100%;padding:12px;border:1px solid #eee;border-radius:12px;font-size:14px;box-sizing:border-box" placeholder="新密码" type="password">
    </div>
    <div style="margin-bottom:16px">
      <input style="width:100%;padding:12px;border:1px solid #eee;border-radius:12px;font-size:14px;box-sizing:border-box" placeholder="确认新密码" type="password">
    </div>
    <button style="width:100%;padding:14px;background:#d46a3a;color:#fff;border:none;border-radius:24px;font-weight:bold;font-size:15px">重置密码</button>
  </div>
</div>
</div>
