name: kitchen_assistant
description: 智能厨房助手 App

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.4.9

  # 网络请求
  dio: ^5.4.0

  # 图片选择
  image_picker: ^1.0.7

  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 路由
  go_router: ^13.1.0

  # UI 组件
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1

  # 工具
  intl: ^0.18.1
  uuid: ^4.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
